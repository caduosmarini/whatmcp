[package]
name = "whatmcp-desktop"
version = "0.3.0"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "=2.13.2"
tauri-plugin-single-instance = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
