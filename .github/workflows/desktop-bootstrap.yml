name: Desktop bootstrap

'on':
  # Manual while the desktop app does not exist. Add a main-branch trigger later.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: ${{ matrix.target }} scaffold
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
            arch: arm64
          - os: windows-2025
            target: windows-x64
            arch: x64
    env:
      WHATMCP_HOME: ${{ github.workspace }}/.ci-sandbox/data
      OPENAI_API_KEY: ''
      BOOTSTRAP_TARGET: ${{ matrix.target }}
      BOOTSTRAP_ARCH: ${{ matrix.arch }}
      BOOTSTRAP_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run existing fixture tests on this platform
        run: npm test -- --test-concurrency=2
      # Future: compile native collectors and bundle the WhatMCP runtime, then
      # build the React/Tauri project. Keep signing/publication in a separate workflow.
      - name: Create bootstrap manifest (not an application build)
        run: node scripts/ci/desktop-bootstrap.mjs
      - name: Upload bootstrap manifest
        uses: actions/upload-artifact@v7
        with:
          name: desktop-bootstrap-${{ matrix.target }}
          path: artifacts/desktop-bootstrap.json
          if-no-files-found: error
          retention-days: 7
